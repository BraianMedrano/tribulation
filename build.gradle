plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'jacoco'
}

// Version, base repositories, gametest/datagen wiring, JaCoCo + jacocoMergedReport, datagen
// idempotence, and packaging excludes: hub-owned, synced verbatim (see mc-gradle-builds).
apply from: 'gradle/concord-common.gradle'

repositories {
    // The shared Shedaniel repo is scoped to Cloth Config only; REI resolves from here.
    maven {
        name = 'ShedanielRei'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Fabric
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client source set
    "clientImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // Optional integrations: compile-only so players get each one only when they install the mod
    // themselves, plus the full mod on the dev runtime. 26.x ships unobfuscated, so these are plain
    // `compileOnly`/`localRuntime` (no remapping). WTHIT and EMI stay disabled (no 26.3 build
    // exists, sources excluded below), and Meridian is reached by reflection only. See PORTING.md.

    // Mod Menu — config screen entry point.
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Cloth Config — config screen builder used by ModMenuIntegration.
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    localRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Jade — probe-tooltip integration. No api split published; only snownee.jade.api is used.
    compileOnly "maven.modrinth:jade:${project.jade_version}"
    localRuntime "maven.modrinth:jade:${project.jade_version}"

    // REI — recipe viewer info panel. Its POM declares Architectury at runtime scope only, but
    // the API's EntryStacks overloads name Architectury's FluidStack, so javac needs it too.
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    localRuntime "dev.architectury:architectury-fabric:${project.architectury_version}"

    // JEI — recipe viewer info panel. The `fabric` runtime jar shades in all `common-api`
    // classes, so `transitive = false` keeps the same classes off the classpath twice.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    localRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
        transitive = false
    }

    // Tests
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Knot-based classloader that boots Fabric before tests run — registries,
    // item registrations, and onInitialize are available without Bootstrap.bootStrap().
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// Expose the client source set's compiled output (not its dependency configurations) to unit
// tests so they can reach client-only classes and the client resource root. Only .output is
// added, never client.compileClasspath/runtimeClasspath, so the unmapped fabric-api sibling the
// shared testRuntimeClasspath exclusion guards against is never pulled in.
// Port to 26.3: WTHIT and EMI have no 26.3 build yet, so their adapters stay on disk but out of
// the build. Restore each by deleting its exclude once a 26.3 build exists. See PORTING.md.
sourceSets {
    main {
        java.exclude 'com/rfizzle/tribulation/compat/wthit/**'
        resources.exclude 'waila_plugins.json'
    }
    client {
        java.exclude 'com/rfizzle/tribulation/compat/emi/EmiShardPlugin.java'
    }
}

sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

// Port to 26.3 (phase 7): a client gametest drives a real client connected to a real dedicated
// server, to prove the payloads, the HUD, the peek keybind and item use end to end. It runs only
// through `runClientGametest` (it opens a game window), never as part of `build` or CI, and its
// source set is not packaged.
sourceSets {
    clientGametest {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
    }
}

loom {
    runs {
        clientGametest {
            client()
            name "Client Game Test"
            source sourceSets.clientGametest
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=tribulation-client-gametest"
            runDir "build/clientGametest"
        }
    }
}

// The test's in-process dedicated server refuses to start without an accepted EULA in its run
// directory (what Loom's `fabricApi.configureTests { eula = true }` writes for its own runs).
def clientGametestEula = layout.projectDirectory.file('build/clientGametest/eula.txt').asFile
tasks.matching { it.name == 'runClientGametest' }.configureEach {
    doFirst {
        clientGametestEula.parentFile.mkdirs()
        clientGametestEula.text = 'eula=true\n'
    }
}

test {
    // SpriteMarginTest reads the glyph specs off disk to learn which shipped textures are
    // sprites and owe a transparent margin. art/ is not on the test classpath, so declare it
    // as an input too — otherwise a spec edit leaves the task UP-TO-DATE and the check skips.
    // Only the specs: the renders glyph.py drops beside them are gitignored throwaways, and
    // snapshotting those would let a routine re-render invalidate the whole test task. The
    // masters the test also opens need no declaration — they are on the test runtime classpath.
    inputs.files(fileTree(dir: 'art/glyphs', include: '**/*.glyph')).withPropertyName('glyphSpecs')
}
