# Mod Properties
# Local/dev base only — releases derive the version from the pushed tag.
mod_version=0.0.0
maven_group=com.rfizzle
archives_base_name=tribulation

# Optional integrations, all 26.3 builds (see PORTING.md for WTHIT and EMI, still disabled).
# Mod Menu — config screen entry point. Modrinth Maven.
modmenu_version=21.0.0
# Cloth Config — config screen builder. Shedaniel Maven.
cloth_config_version=26.3.159
# Jade — probe-tooltip integration. Modrinth Maven (no api split).
jade_version=26.3.5+fabric
# REI — recipe viewer. Shedaniel Maven; Architectury from its own Maven.
rei_version=26.3.824
architectury_version=22.0.5
# JEI — recipe viewer. BlameJared Maven; the artifact name carries the Minecraft version.
jei_version=31.17.0.108

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
# VFORK launch mechanism avoids "Failed to exec spawn helper" when the test
# task forks a JVM under WSL2. See https://github.com/gradle/gradle/issues/27027
org.gradle.jvmargs=-Xmx2G -Djdk.lang.Process.launchMechanism=VFORK
